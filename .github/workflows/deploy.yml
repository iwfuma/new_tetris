name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_FALL_INTERVAL: ${{ vars.VITE_FALL_INTERVAL || 400 }}
          VITE_GAME_TIME: ${{ vars.VITE_GAME_TIME || 100 }}
          VITE_BLOCK_SIZE: ${{ vars.VITE_BLOCK_SIZE || 30 }}
          VITE_ROWS: ${{ vars.VITE_ROWS || 15 }}
          VITE_COLS: ${{ vars.VITE_COLS || 10 }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4